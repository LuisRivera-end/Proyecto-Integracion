<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumno</title>
  <link rel="stylesheet" href="./dist/output.css" />
  <link rel="stylesheet" href="./static/css/toastify.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body
  class="bg-gradient-to-br from-slate-600 via-slate-500 to-emerald-300 min-h-screen flex flex-col bg-fixed w-7xl mx-auto">

  <!-- ═══ Loading Overlay ═══ -->
  <div id="loading-overlay" style="
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
      background: linear-gradient(135deg, #475569, #64748b, #6ee7b7);
      transition: opacity 0.5s ease;
    ">
    <div style="
        width: 56px; height: 56px;
        border: 4px solid rgba(255,255,255,0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: lo-spin 0.8s linear infinite;
      "></div>
    <p style="color: #fff; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.025em;">
      Conectando con el servidor…
    </p>
    <style>
      @keyframes lo-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </div>
  <div class="flex-1 flex items-center justify-center p-4 py-8">
    <a href="login.html"
      class="fixed top-6 right-6 bg-slate-600 hover:bg-slate-700 text-white p-3 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 z-50"
      title="Iniciar Sesión">
      <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
    </a>
    <div class="w-full relative">
      <div id="form-container" class="bg-white/95 backdrop-blur-sm rounded-3xl shadow-2xl p-10 border border-slate-200">
        <div class="text-center mb-10">
          <div class="inline-flex items-center justify-center w-40 h-35">
            <img src="./public/ual_no_fondo.png" alt="Logo UAL" class="w-full h-full object-contain" />
          </div>
          <h1 class="text-3xl font-bold text-slate-800 mb-2 mt-2">
            Sistema de tickets
          </h1>
          <p class="text-slate-600 text-base">Genera tu ticket de atención</p>
        </div>

        <div class="space-y-4">
          <label class="block text-lg font-semibold text-slate-700 mb-2 text-center">
            Departamento de Atención
          </label>
          <div id="sector-buttons" class="grid grid-cols-2 gap-4">
            <!-- Buttons will be populated by JS -->
          </div>
        </div>
      </div>

      <div id="ticket-result"
        class="hidden bg-white/95 backdrop-blur-sm rounded-3xl shadow-2xl p-10 border border-slate-200 max-w-md mx-auto"
        data-ticket-type="normal">
        <div class="text-center">
          <div class="mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 rounded-full">
              <svg class="w-12 h-12 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
          </div>

          <h2 class="text-2xl font-bold text-slate-800 mb-2">Ticket Generado</h2>

          <div class="my-6">
            <span id="result-ticket" class="text-7xl font-black text-emerald-700 drop-shadow-sm"></span>
          </div>

          <div
            class="bg-gradient-to-br from-slate-50 to-emerald-50 rounded-2xl p-6 mb-6 space-y-4 border border-slate-200">
            <div class="flex justify-between items-center py-2 border-b border-slate-200">
              <span class="text-slate-600 font-medium text-sm">Sector:</span>
              <span id="result-sector" class="text-slate-900 font-bold text-base"></span>
            </div>
            <div class="flex justify-between items-center py-2">
              <span class="text-slate-600 font-medium text-sm">Fecha:</span>
              <span id="result-fecha" class="text-slate-900 font-bold text-lg"></span>
            </div>
          </div>
          <p class="text-slate-600 mb-6 text-sm">Por favor, espera a que tu número sea llamado</p>

          <div class="space-y-3">
            <button onclick="imprimir()"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl transition-all duration-300 shadow-md hover:shadow-lg flex items-center justify-center gap-2 cursor-pointer">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
              </svg>
              Imprimir Ticket
            </button>

            <button onclick="resetForm()"
              class="w-full bg-slate-600 hover:bg-slate-700 text-white font-semibold py-3.5 rounded-xl transition-all duration-300 shadow-md hover:shadow-lg cursor-pointer">
              Finalizar
            </button>
          </div>
        </div>
      </div>

      <div id="error-message" class="hidden mt-4 bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-xl">
        <p id="error-text"></p>
      </div>
    </div>

    <script src="./js/lib/socket.io.min.js"></script>
    <script src="./static/js/toastify.js"></script>
    <!-- idiomas -->
    <div class="gtranslate_wrapper" title="Cambiar idioma"></div>
    <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>
    <script src="./js/idioma.js"></script>
  </div>
  <script type="module" src="./js/alumno.js"></script>
</body>

</html>
