<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Turnos</title>
    <link rel="stylesheet" href="./dist/output.css">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        /* Animación del punto de estado */
        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.4);
            }
        }

        .pulse-dot {
            animation: pulse-dot 2s infinite;
        }

        /* Chips de sector en la tabla (colores semánticos) */
        .chip-cajas {
            background: #dcfce7;
            color: #15803d;
        }

        .chip-servicios {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .chip-becas {
            background: #fef3c7;
            color: #b45309;
        }

        .chip-tesoreria {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* Sin tickets centrado */
        #sinTickets {
            display: none;
        }

        /* Ticker horizontal para tickets extra */
        @keyframes ticker-scroll {
            0%   { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .ticker-track {
            display: flex;
            gap: 2rem;
            animation: ticker-scroll 20s linear infinite;
            white-space: nowrap;
        }
        .ticker-track:hover {
            animation-play-state: paused;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-700 via-slate-600 to-emerald-500">

    <!-- Layout principal: izq. grande | der. panel -->
    <div class="flex gap-4 p-4 min-h-screen">

        <!-- ══════════ IZQUIERDA: Tablero de tickets ══════════ -->
        <div class="flex-1 flex flex-col rounded-2xl overflow-hidden shadow-2xl border border-slate-200 min-h-0 bg-white">

            <!-- Sección: Turnos en Atención -->
            <div id="atendiendo-container" class="hidden">
                <div class="bg-amber-500 px-8 py-2 flex items-center gap-2">
                    <span class="inline-block w-2.5 h-2.5 bg-white rounded-full pulse-dot"></span>
                    <span class="text-white text-xs font-bold uppercase tracking-widest">Atendiendo ahora</span>
                </div>
                <div id="atendiendo-filas" class="bg-amber-50"></div>
            </div>

            <!-- Cabecera del tablero -->
            <div class="grid grid-cols-3 bg-slate-800 px-8 py-3">
                <span class="text-slate-300 text-xs font-bold uppercase tracking-widest">Ticket</span>
                <span class="text-slate-300 text-xs font-bold uppercase tracking-widest">Sector</span>
                <span class="text-slate-300 text-xs font-bold uppercase tracking-widest">Ventanilla</span>
            </div>

            <!-- Filas de tickets pendientes (llenado por JS) -->
            <div id="contenedor" class="flex-1 overflow-y-auto"></div>

            <!-- Sin tickets -->
            <div id="sinTickets" class="flex-1 flex flex-col items-center justify-center gap-3 text-slate-400 py-16">
                <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <p class="text-lg font-semibold">No hay tickets en espera</p>
            </div>

            <!-- Footer ticker para tickets extra -->
            <div id="ticker-container" class="hidden bg-slate-800 border-t border-slate-200 px-4 py-3 overflow-hidden">
                <div class="flex items-center gap-3">
                    <span class="text-slate-400 text-xs font-bold uppercase tracking-widest flex-shrink-0">Más en cola ▸</span>
                    <div class="flex-1 overflow-hidden">
                        <div id="ticker-track" class="ticker-track"></div>
                    </div>
                </div>
            </div>

        </div>
        <!-- fin izquierda -->

        <!-- ══════════ DERECHA: Info + Sectores ══════════ -->
        <div class="w-[28rem] flex-shrink-0 flex flex-col gap-4">

            <!-- Tarjeta: título + audio -->
            <div class="bg-white/95 backdrop-blur rounded-2xl shadow-xl p-6">

                <h1 class="text-3xl font-extrabold text-slate-800 leading-tight">Sistema<br>de Turnos</h1>

                <div class="flex items-center gap-2 mt-2">
                    <span class="pulse-dot inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>
                    <span class="text-slate-500 text-sm font-medium">Actualización automática</span>
                </div>

                <button id="activarAudio"
                    class="mt-5 w-full flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all text-sm">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a6 6 0 000-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                    </svg>
                    Activar avisos por voz
                </button>
            </div>

            <!-- Tarjeta: badges de sector -->
            <div class="bg-white/95 backdrop-blur rounded-2xl shadow-xl p-6">

                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest text-center mb-5">
                    Tickets en espera por sector
                </p>

                <div id="sector-badges" class="grid grid-cols-2 gap-4">
                    <!-- Se llenará dinámicamente por conteo.js -->
                </div>
            </div>
            <!-- fin badges -->

        </div>
        <!-- fin derecha -->

    </div>
    <!-- fin layout -->

    <!-- Tabla fantasma para compatibilidad con JS que use #tickets -->
    <table id="tickets" class="hidden">
        <tbody></tbody>
    </table>

    <script src="./js/lib/socket.io.min.js"></script>
    <script type="module" src="./js/pantalla.js"></script>
    <script type="module" src="./js/conteo.js"></script>
    <audio id="alertaAudio" preload="auto"></audio>
</body>

</html>
