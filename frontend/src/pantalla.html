<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Turnos</title>
    <link rel="stylesheet" href="./dist/output.css">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        /* Scrollbar elegante */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Chips de sector en la tabla (colores semánticos) */
        .chip-cajas {
            background: #dcfce7;
            color: #15803d;
        }

        .chip-servicios {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .chip-becas {
            background: #fef3c7;
            color: #b45309;
        }

        .chip-tesoreria {
            background: #fee2e2;
            color: #b91c1c;
        }

        @keyframes pulse-dot {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(255, 255, 255, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        .pulse-dot {
            animation: pulse-dot 2s infinite;
        }

        /* Sin tickets centrado */
        #sinTickets {
            display: none;
        }

        /* Ticker horizontal para tickets extra */
        @keyframes ticker-scroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .ticker-track {
            display: flex;
            gap: 2rem;
            white-space: nowrap;
        }

        .ticker-track.animado {
            animation: ticker-scroll 20s linear infinite;
        }

        .ticker-track:hover {
            animation-play-state: paused;
        }

        /* Animación de entrada para filas */
        .fade-in-row {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="h-screen bg-gradient-to-br from-[#0c4944] via-[#115e59] to-[#042f2e] overflow-hidden">

    <!-- ═══ Loading Overlay ═══ -->
    <div id="loading-overlay" style="
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
      background: linear-gradient(135deg, #0c4944, #115e59, #042f2e);
      transition: opacity 0.5s ease;
    ">
        <div style="
        width: 56px; height: 56px;
        border: 4px solid rgba(255,255,255,0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: lo-spin 0.8s linear infinite;
      "></div>
        <p style="color: #fff; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.025em;">
            Conectando con el servidor…
        </p>
        <style>
            @keyframes lo-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </div>

    <!-- Layout principal -->
    <div class="flex gap-5 p-5 h-full">

        <!-- ══════════ IZQUIERDA: Tablero de tickets ══════════ -->
        <div
            class="flex-1 flex flex-col rounded-[2rem] overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-white/10 bg-white/95 backdrop-blur-xl min-h-0">

            <!-- Sección: Turnos en Atención -->
            <div id="atendiendo-container" class="hidden">
                <div
                    class="bg-gradient-to-r from-amber-500 to-orange-500 px-8 py-3.5 flex items-center gap-3 shadow-md z-10">
                    <span class="inline-block w-3 h-3 bg-white rounded-full pulse-dot"></span>
                    <span class="text-white text-sm font-black uppercase tracking-widest drop-shadow-sm">Atendiendo
                        Ahora</span>
                </div>
                <div id="atendiendo-filas" class="bg-orange-50/50"></div>
            </div>

            <!-- Cabecera del tablero -->
            <div class="grid grid-cols-3 bg-slate-100/80 px-8 py-4 border-y border-slate-200 backdrop-blur-sm">
                <span class="text-slate-500 text-lg font-bold uppercase tracking-widest">Ticket</span>
                <span class="text-slate-500 text-lg font-bold uppercase tracking-widest">Sector</span>
                <span class="text-slate-500 text-lg font-bold uppercase tracking-widest">Ventanilla</span>
            </div>

            <!-- Filas de tickets pendientes (llenado por JS) -->
            <div id="contenedor" class="flex-1 overflow-hidden bg-white/50"></div>

            <!-- Sin tickets -->
            <div id="sinTickets" class="flex-1 flex flex-col items-center justify-center gap-4 text-slate-400 py-16">
                <div class="bg-slate-100 p-6 rounded-full">
                    <svg class="w-12 h-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <p class="text-xl font-medium text-slate-500">No hay tickets en espera</p>
            </div>

            <!-- Footer ticker para tickets extra -->
            <div id="ticker-container" class="hidden bg-slate-800 border-t border-slate-700 px-6 py-3 overflow-hidden">
                <div class="flex items-center gap-4">
                    <span
                        class="text-amber-400 text-xs font-black uppercase tracking-widest flex-shrink-0 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                        </svg>
                        Más en cola
                    </span>
                    <div class="flex-1 overflow-hidden">
                        <div id="ticker-track" class="ticker-track"></div>
                    </div>
                </div>
            </div>

        </div>
        <!-- fin izquierda -->

        <!-- ══════════ DERECHA: Info + Sectores ══════════ -->
        <div class="w-[26rem] flex-shrink-0 flex flex-col gap-5">

            <!-- Tarjeta: título + audio -->
            <div
                class="bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.15)] border border-white/20 p-8 flex flex-col items-center text-center relative overflow-hidden">

                <!-- Decoración de fondo sutil -->
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl"></div>

                <div
                    class="flex justify-center mb-6 bg-slate-50 p-4 rounded-2xl w-full shadow-inner border border-slate-100">
                    <img src="./public/ual_no_fondo.png" alt="Logo UAL" class="h-32 object-contain">
                </div>

                <h1 class="text-3xl font-black text-slate-800 tracking-tight">Sistema de Turnos</h1>
                <button id="activarAudio"
                    class="mt-8 w-full flex items-center justify-center gap-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-emerald-500/30 transition-all duration-300 active:scale-95 transform hover:-translate-y-0.5">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a6 6 0 000-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                    </svg>
                    Activar avisos por voz
                </button>
            </div>

            <!-- Tarjeta: badges de sector -->
            <div
                class="bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.15)] border border-white/20 p-8">

                <div class="flex items-center gap-3 mb-6">
                    <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    <h2 class="text-slate-500 text-xs font-bold uppercase tracking-widest">
                        Espera por sector
                    </h2>
                </div>

                <div id="sector-badges" class="grid grid-cols-2 gap-4">
                    <!-- Se llenará dinámicamente por conteo.js -->
                </div>
            </div>
            <!-- fin badges -->

        </div>
        <!-- fin derecha -->

    </div>
    <!-- fin layout -->

    <!-- Tabla fantasma para compatibilidad con JS que use #tickets -->
    <table id="tickets" class="hidden">
        <tbody></tbody>
    </table>

    <script src="./js/lib/socket.io.min.js"></script>
    <script type="module" src="./js/pantalla.js"></script>
    <script type="module" src="./js/conteo.js"></script>
    <audio id="alertaAudio" preload="auto"></audio>
</body>

</html>
