<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Turnos</title>
    <link rel="stylesheet" href="./dist/output.css">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        /* Animación del punto de estado */
        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.4);
            }
        }

        .pulse-dot {
            animation: pulse-dot 2s infinite;
        }

        /* Chips de sector en la tabla (colores semánticos) */
        .chip-cajas {
            background: #dcfce7;
            color: #15803d;
        }

        .chip-servicios {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .chip-becas {
            background: #fef3c7;
            color: #b45309;
        }

        .chip-tesoreria {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* Sin tickets centrado */
        #sinTickets {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-700 via-slate-600 to-emerald-500">

    <!-- Layout principal: izq. grande | der. panel -->
    <div class="flex gap-4 p-4 min-h-screen">

        <!-- ══════════ IZQUIERDA: Tablero de tickets ══════════ -->
        <div class="flex-1 flex flex-col rounded-2xl overflow-hidden shadow-2xl border-2 border-green-900 min-h-0"
            style="background:#166534;">

            <!-- Cabecera del tablero -->
            <div class="grid grid-cols-3 bg-green-950 px-8 py-3">
                <span class="text-green-300 text-xs font-bold uppercase tracking-widest">Ticket</span>
                <span class="text-green-300 text-xs font-bold uppercase tracking-widest">Sector</span>
                <span class="text-green-300 text-xs font-bold uppercase tracking-widest">Ventanilla</span>
            </div>

            <!-- Filas de tickets (llenado por JS) -->
            <div id="contenedor" class="flex-1 overflow-y-auto"></div>

            <!-- Sin tickets -->
            <div id="sinTickets" class="flex-1 flex flex-col items-center justify-center gap-3 text-green-200/60 py-16">
                <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <p class="text-lg font-semibold">No hay tickets en espera</p>
            </div>

        </div>
        <!-- fin izquierda -->

        <!-- ══════════ DERECHA: Info + Sectores ══════════ -->
        <div class="w-[28rem] flex-shrink-0 flex flex-col gap-4">

            <!-- Tarjeta: título + audio -->
            <div class="bg-white/95 backdrop-blur rounded-2xl shadow-xl p-6">

                <h1 class="text-3xl font-extrabold text-slate-800 leading-tight">Sistema<br>de Turnos</h1>

                <div class="flex items-center gap-2 mt-2">
                    <span class="pulse-dot inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>
                    <span class="text-slate-500 text-sm font-medium">Actualización automática</span>
                </div>

                <button id="activarAudio"
                    class="mt-5 w-full flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all text-sm">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a6 6 0 000-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                    </svg>
                    Activar avisos por voz
                </button>
            </div>

            <!-- Tarjeta: badges de sector -->
            <div class="bg-white/95 backdrop-blur rounded-2xl shadow-xl p-6 flex-1 flex flex-col">

                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest text-center mb-5">
                    Tickets en espera por sector
                </p>

                <div class="grid grid-cols-2 grid-rows-2 gap-4 flex-1">

                    <!-- Cajas -->
                    <div class="flex flex-col gap-1 flex-1">
                        <span class="text-slate-500 text-sm font-bold uppercase tracking-wider">Cajas</span>
                        <div
                            class="flex flex-1 items-center justify-center gap-3 border-2 border-green-500 bg-green-50 rounded-2xl px-3 hover:-translate-y-0.5 transition-transform">
                            <span class="inline-flex p-2 bg-green-500 rounded-xl text-white">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
                                </svg>
                            </span>
                            <span id="count-cajas" class="text-5xl font-black text-green-700">0</span>
                        </div>
                    </div>

                    <!-- Servicios Escolares -->
                    <div class="flex flex-col gap-1 flex-1">
                        <span class="text-slate-500 text-sm font-bold uppercase tracking-wider leading-tight">Serv.
                            Escolares</span>
                        <div
                            class="flex flex-1 items-center justify-center gap-3 border-2 border-blue-500 bg-blue-50 rounded-2xl px-3 hover:-translate-y-0.5 transition-transform">
                            <span class="inline-flex p-2 bg-blue-500 rounded-xl text-white">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                </svg>
                            </span>
                            <span id="count-servicios" class="text-5xl font-black text-blue-700">0</span>
                        </div>
                    </div>

                    <!-- Becas -->
                    <div class="flex flex-col gap-1 flex-1">
                        <span class="text-slate-500 text-sm font-bold uppercase tracking-wider">Becas</span>
                        <div
                            class="flex flex-1 items-center justify-center gap-3 border-2 border-amber-500 bg-amber-50 rounded-2xl px-3 hover:-translate-y-0.5 transition-transform">
                            <span class="inline-flex p-2 bg-amber-500 rounded-xl text-white">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </span>
                            <span id="count-becas" class="text-5xl font-black text-amber-700">0</span>
                        </div>
                    </div>

                    <!-- Tesorería -->
                    <div class="flex flex-col gap-1 flex-1">
                        <span class="text-slate-500 text-sm font-bold uppercase tracking-wider">Tesorería</span>
                        <div
                            class="flex flex-1 items-center justify-center gap-3 border-2 border-red-500 bg-red-50 rounded-2xl px-3 hover:-translate-y-0.5 transition-transform">
                            <span class="inline-flex p-2 bg-red-500 rounded-xl text-white">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                                </svg>
                            </span>
                            <span id="count-tesoreria" class="text-5xl font-black text-red-700">0</span>
                        </div>
                    </div>

                </div>
            </div>
            <!-- fin badges -->

        </div>
        <!-- fin derecha -->

    </div>
    <!-- fin layout -->

    <!-- Tabla fantasma para compatibilidad con JS que use #tickets -->
    <table id="tickets" class="hidden">
        <tbody></tbody>
    </table>

    <script src="./js/lib/socket.io.min.js"></script>
    <script type="module" src="./js/pantalla.js"></script>
    <script type="module" src="./js/conteo.js"></script>
    <audio id="alertaAudio" preload="auto"></audio>
</body>

</html>
